name: release
# YugabyteDB for the Raspberry Pi 4 and 5 (built for plain ARMv8.0, tested as a Cortex-A72). Upstream's arm64 builds target
# armv8.2+rcpc and SIGILL on a Pi 4.
#   thirdparty: rebuild yugabyte-db-thirdparty (libc++, absl, tcmalloc, ...) for armv8-a
#   build:      rebuild yb-master/yb-tserver/postgres/tools against it
#   image:      overlay onto upstream's arm64 image, test every binary + a master/tserver/YSQL session under QEMU as a
#               Cortex-A72, then publish ghcr.io/<owner>/yugabyte-pi:<tag> = upstream's stock amd64 + our arm64
on:
  workflow_dispatch:
    inputs:
      yb_tag:
        default: v2025.2.8.1
      base:
        description: upstream image to overlay (and to use as-is for amd64)
        default: yugabytedb/yugabyte:2025.2.8.1-b8
      tag:
        description: published tag
        default: 2025.2.8.1-b1
      thirdparty_commit:
        default: 648722cbaa4f4dfd0fff9689925f374ee3ef7a32
      publish:
        type: boolean
        default: true
env:
  MARCH: armv8-a+crc
  MTUNE: cortex-a72
  # the RPATHs bake this path in; the image reproduces it
  BUILD_DIR: /__w/yugabyte-pi/yugabyte-pi/yb/build/release-clang19-dynamic-ninja
permissions:
  contents: read
concurrency: release   # one build at a time: they share the ccache keys and the published tags

jobs:
  check:   # fail in seconds, not after a 2h build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read, packages: read }
    env:
      YB_TAG: ${{ inputs.yb_tag }}
      BASE: ${{ inputs.base }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inputs agree with each other
        run: |
          [[ $TAG =~ ^[0-9]+(\.[0-9]+)+-b[0-9]+$ ]] || { echo "tag '$TAG' must look like 2025.2.8.1-b1"; exit 1; }
          v=${YB_TAG#v}
          [[ $TAG == "$v"-b* && $BASE == *":$v-b"* ]] || { echo "yb_tag=$YB_TAG, base=$BASE and tag=$TAG are for different versions"; exit 1; }
      - name: Published -bN tags are immutable
        if: inputs.publish
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/yugabyte-pi:$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; bump -bN"; exit 1
          fi

  thirdparty:
    needs: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container:
      image: yugabyteci/yb_build_infra_almalinux8_aarch64:v2026-01-27T21_32_05
      options: --user root --init   # --init: bazel (abseil) needs its server reaped
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools (git, gh, rust for clockbound) and the GitHub 504 workarounds
        run: |
          dnf -q -y install git 'dnf-command(config-manager)' >/dev/null 2>&1
          dnf -q -y config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo && dnf -q -y install gh
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          install -m755 scripts/curl-gh /usr/local/bin/curl-gh
      - name: Source and CPU flags
        run: |
          git config --global --add safe.directory '*'
          mkdir -p /opt/yb-build/thirdparty/tp && cd /opt/yb-build/thirdparty/tp
          git init -q && git remote add origin https://github.com/yugabyte/yugabyte-db-thirdparty.git
          git fetch -q --depth 1 origin ${{ inputs.thirdparty_commit }} && git checkout -q FETCH_HEAD
          sed -i "s|'-march=armv8.2-a+fp16+rcpc+dotprod+crypto'|'-march=$MARCH'|; s|'-mtune=neoverse-n1'|'-mtune=$MTUNE'|" python/yugabyte_db_thirdparty/builder.py
          python3 "$GITHUB_WORKSPACE/scripts/patch-downloader.py"
          python3 "$GITHUB_WORKSPACE/scripts/patch-tcmalloc.py"
          git diff --stat
      - uses: actions/cache/restore@v4
        with:
          path: ccache
          key: tp-ccache-unused-${{ github.run_id }}
          restore-keys: tp-ccache-${{ inputs.thirdparty_commit }}-${{ env.MARCH }}-
      - name: Build (stops itself before the job limit so the ccache still saves)
        working-directory: /opt/yb-build/thirdparty/tp
        env:
          CCACHE_DIR: ${{ github.workspace }}/ccache
          CCACHE_MAXSIZE: 8G
          YB_THIRDPARTY_ARCHIVE_NAME_SUFFIX: pi
        run: |
          timeout 340m stdbuf -oL -eL ./build_thirdparty.sh --toolchain=llvm19 --skip-sanitizers \
            --use-ccache --concise-output --create-package --cleanup-before-packaging 2>&1 | stdbuf -oL cut -c1-300
          exit ${PIPESTATUS[0]}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ccache
          key: tp-ccache-${{ inputs.thirdparty_commit }}-${{ env.MARCH }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: thirdparty
          path: /opt/yb-build/thirdparty/tp/archive.tar.gz
          compression-level: 0
          retention-days: 1

  build:
    needs: thirdparty
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container:
      image: yugabyteci/yb_build_infra_almalinux8_aarch64:v2026-01-27T21_32_05
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: thirdparty, path: tpdl }
      - name: Source, CPU flags, thirdparty
        run: |
          dnf -q -y install git >/dev/null 2>&1 || true
          # pg_parquet and documentdb build through pgrx (Rust); the yb build finds cargo in ~/.cargo/bin
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          git config --global --add safe.directory '*'
          git clone -q --depth 1 --branch "${{ inputs.yb_tag }}" https://github.com/yugabyte/yugabyte-db.git yb
          sed -i "s|-march=armv8.2-a+fp16+rcpc+dotprod+crypto|-march=$MARCH|; s|ADD_CXX_FLAGS(\"-mtune=neoverse-n1\")|ADD_CXX_FLAGS(\"-mtune=$MTUNE\")|" yb/CMakeLists.txt
          # unpacked at the path it was built at: the libs' RPATHs point there
          mkdir -p /opt/yb-build/thirdparty && tar -xzf tpdl/archive.tar.gz -C /opt/yb-build/thirdparty && rm -rf tpdl
      - uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-unused-${{ github.run_id }}
          restore-keys: ccache-${{ inputs.yb_tag }}-${{ env.MARCH }}-
      - name: Build
        working-directory: yb
        env:
          YB_THIRDPARTY_DIR: /opt/yb-build/thirdparty/tp
          CCACHE_DIR: ${{ github.workspace }}/ccache
          CCACHE_MAXSIZE: 8G
        run: |
          mkdir -p "$CCACHE_DIR"
          timeout 340m stdbuf -oL -eL ./yb_build.sh --clang19 release --no-linuxbrew --skip-java 2>&1 | stdbuf -oL cut -c1-300
          exit ${PIPESTATUS[0]}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ccache
          key: ccache-${{ inputs.yb_tag }}-${{ env.MARCH }}-${{ github.run_id }}
      - name: Package (the runtime tree and the thirdparty libs, at their absolute paths)
        run: |
          B=yb/build/release-clang19-dynamic-ninja; TP=$(cat "$B/thirdparty_path.txt")
          ROOT=$PWD/$B
          # drop debug info (the tree is ~1GB with it); the image only needs the runtime
          STRIP=$(command -v strip || ls /opt/yb-build/llvm/*/bin/llvm-strip | head -1)
          find "$ROOT/bin" "$ROOT/lib" "$ROOT/postgres" "$TP" -type f \( -name '*.so' -o -name '*.so.*' -o -perm -u+x \) \
            -exec sh -c 'for f; do [ "$(head -c4 "$f")" = "$(printf "\177ELF")" ] && "$0" --strip-unneeded "$f" 2>/dev/null; done; true' "$STRIP" {} +
          { for f in bin lib postgres share openssl-config gflag_allowlist.txt master_flags.xml tserver_flags.xml auto_flags.json version_metadata.json; do echo "$ROOT/$f"; done
            find "$TP" \( -name '*.so' -o -name '*.so.*' \); echo "$TP/installed/common/bin/redis-cli"; } | sed 's|^/||' > tree.list
          tar -czf tree.tgz -C / -T tree.list && ls -lh tree.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: tree
          path: tree.tgz
          compression-level: 0
          retention-days: 7

  image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: { contents: read, packages: write }
    services:
      registry:   # holds the arm64 image between overlay -> flatten -> test -> publish
        image: registry:2
        ports: ['5000:5000']
    env:
      L: localhost:5000/yugabyte-pi
      G: ghcr.io/${{ github.repository_owner }}/yugabyte-pi
      BASE: ${{ inputs.base }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: actions/download-artifact@v4
        with: { name: tree }
      - name: Tools
        run: |
          gh release download v0.20.3 -R google/go-containerregistry -p '*Linux_x86_64.tar.gz' -O - | sudo tar -xz -C /usr/local/bin crane
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: Overlay onto upstream arm64, then flatten to one layer
        run: |
          mkdir image/ctx && tar -xzf tree.tgz -C image/ctx && sudo chmod -R a+rX image/ctx
          docker build --platform linux/arm64 --build-arg BASE=$BASE --build-arg B=$BUILD_DIR -t $L:overlay image
          docker push -q $L:overlay
          crane flatten $L:overlay -t $L:flat
          echo "upstream arm64: $(crane manifest --platform linux/arm64 $BASE | jq '[.layers[].size]|add/1e6|floor') MB compressed"
          echo "ours (flat):    $(crane manifest $L:flat | jq '[.layers[].size]|add/1e6|floor') MB compressed"
          mkdir rootfs && crane export $L:flat - | sudo tar -x -C rootfs
      - name: Same extensions as upstream's image (pg_parquet and documentdb need the Rust build)
        run: |
          # paths relative to postgres/; ours is a symlink to the build dir with an absolute target, so look there
          pat='^(share/extension/[^/]+\.control|lib/[^/]+\.so)$'
          crane export --platform linux/arm64 $BASE - | tar -t | sed 's|^\./||' | sed -n 's|^home/yugabyte/postgres/||p' | grep -E "$pat" | sort > upstream.txt
          (cd "rootfs$BUILD_DIR/postgres" && find share/extension lib \( -type f -o -type l \) | grep -E "$pat" | sort) > ours.txt
          wc -l upstream.txt ours.txt
          missing=$(comm -23 upstream.txt ours.txt); [ -z "$missing" ] || { echo "missing from our image:"; echo "$missing"; exit 1; }
      - name: Every executable runs as a Cortex-A72 (no SIGILL)
        run: ./scripts/tools-smoke.sh rootfs
      - name: Master + tserver + YSQL create/insert/select as a Cortex-A72
        timeout-minutes: 30
        env:
          TSERVER_FLAGS: --ysql_yb_enable_ash=false   # the ASH collector segfaults under qemu-user only (fine natively); `verify` covers it
        run: ./scripts/ysql-smoke.sh rootfs "$BUILD_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: |
            master.log
            tserver.log
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish (our arm64 + upstream's stock amd64, merged)
        if: inputs.publish
        run: |
          crane copy $L:flat $G:$TAG-arm64
          crane copy $BASE@$(crane digest --platform linux/amd64 $BASE) $G:$TAG-amd64
          crane index append -t $G:$TAG -m $G:$TAG-arm64 -m $G:$TAG-amd64
          # floating tag: the newest build of this Yugabyte version (pin the -bN tag for reproducibility)
          crane tag $G:$TAG ${TAG%-b*}
          crane manifest $G:$TAG | jq -c '.manifests[]|{digest,platform}'

  verify:   # QEMU can't run the ASH collector (segfaults, native arm64 is fine), so test the published tag natively, ASH on
    needs: [check, image]
    if: inputs.publish
    uses: ./.github/workflows/smoke.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/yugabyte-pi:${{ inputs.tag }}
