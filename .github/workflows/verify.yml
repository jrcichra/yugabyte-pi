name: verify
# Lay a build's overlay onto the upstream arm64 image and see if it runs as a Cortex-A72 (Pi 4).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: build run whose `overlay` artifact to use
        required: true
      image:
        default: yugabytedb/yugabyte:2024.2.7.3-b1
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static binutils-aarch64-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: overlay
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Upstream rootfs + standalone build tree at its absolute paths
        run: |
          mkdir rootfs
          cid=$(docker create --platform linux/arm64 "${{ inputs.image }}")
          docker export "$cid" | tar -x -C rootfs
          tar -xzf overlay-abs.tgz -C rootfs
          B=$(cd rootfs && find . -type d -name release-clang17-dynamic-ninja | head -1 | sed 's|^\.||'); echo "BUILD=$B" | tee -a "$GITHUB_ENV"
      - name: Scan every ELF in the tree (thirdparty included)
        run: |
          find rootfs$BUILD rootfs/opt rootfs/__w -type f \( -name '*.so*' -o -path '*/bin/*' \) 2>/dev/null | while read -r f; do
            file -b "$f" | grep -q 'ELF 64-bit.*ARM aarch64' || continue
            n=$(aarch64-linux-gnu-objdump -d --no-show-raw-insn "$f" 2>/dev/null | awk '$2 ~ /^(ldadd|ldclr|ldeor|ldset|swp|cas|casp|ldapr|ldapur|sdot|udot)[a-z]*$/ {c++} END{print c+0}')
            echo "$n ${f#rootfs}"
          done | sort -rn | awk '$1>0' | head -50 | tee libs.txt
      - name: --version under cortex-a72
        continue-on-error: true
        run: |
          for b in $BUILD/bin/yb-master $BUILD/bin/yb-tserver $BUILD/postgres/bin/postgres; do
            echo "=== $b"; qemu-aarch64-static -cpu cortex-a72 -L rootfs rootfs$b --version 2>&1 | tail -3
          done
      - name: yb-master for 90s under cortex-a72
        continue-on-error: true
        run: |
          mkdir -p rootfs/tmp/m; ls rootfs$BUILD/bin
          timeout 90 qemu-aarch64-static -cpu cortex-a72 -L rootfs rootfs$BUILD/bin/yb-master \
            --master_addresses=127.0.0.1:7100 --rpc_bind_addresses=127.0.0.1:7100 \
            --fs_data_dirs=/tmp/m --replication_factor=1 --use_private_ip=never 2>&1 | tail -40 || true
      - name: Where does the SIGILL happen?
        continue-on-error: true
        run: |
          P=rootfs$BUILD/postgres/bin/postgres
          echo "--- library load order (last 25)"
          qemu-aarch64-static -cpu cortex-a72 -L rootfs -E LD_DEBUG=libs "$P" --version 2>&1 | grep -E 'calling init|error|find library|Illegal' | tail -25
          echo "--- last translated blocks before the crash"
          qemu-aarch64-static -cpu cortex-a72 -L rootfs -singlestep -d in_asm,nochain -D trace.txt "$P" --version >/dev/null 2>&1 || true
          ls -l trace.txt; tail -30 trace.txt
          echo "--- mapping the last pc to a library"
          last=$(grep -oE '^0x[0-9a-f]+' trace.txt | tail -1); echo "last pc $last"
          qemu-aarch64-static -cpu cortex-a72 -L rootfs -d page -D pages.txt "$P" --version >/dev/null 2>&1 || true
          grep -E '^[0-9a-f]+-[0-9a-f]+ ' pages.txt | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: verify, path: libs.txt }
