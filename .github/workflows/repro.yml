name: repro
on:
  workflow_dispatch:
    inputs:
      image:
        description: Official image to inspect
        default: yugabytedb/yugabyte:2024.2.7.3-b1
jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static binutils-aarch64-linux-gnu gdb-multiarch
      - name: Export the arm64 rootfs
        run: |
          mkdir rootfs
          cid=$(docker create --platform linux/arm64 "${{ inputs.image }}")
          docker export "$cid" | tar -x -C rootfs
          du -sh rootfs
          ls rootfs/home/yugabyte rootfs/home/yugabyte/bin 2>&1 | head -40
          echo "--- large files / yb-* entries"
          find rootfs \( -type f -size +20M -o -name 'yb-master*' -o -name 'yb-tserver*' \) -printf '%y %s %p -> %l\n' | sort -k3 | head -40
          find rootfs \( -name yb-master -o -name yb-tserver \) \( -type f -o -type l \) | tee bins.txt
      - name: Run yb-master under QEMU (cortex-a72 = Pi 4, neoverse-n1 = control)
        continue-on-error: true
        run: |
          bin=$(grep '/yb-master$' bins.txt | head -1)
          for cpu in neoverse-n1 cortex-a72; do
            echo "=== -cpu $cpu"
            qemu-aarch64-static -cpu $cpu -L rootfs "$bin" --version 2>&1 | tail -5 || true
            echo "exit: ${PIPESTATUS[0]}"
          done
      - name: Scan for instructions a Pi 4 lacks
        run: |
          for b in $(cat bins.txt); do
            echo "##### $b"
            ./scripts/scan.sh "$b"
          done 2>&1 | tee scan.txt
      - name: Per-file summary of every ELF in the image (which libs carry the offenders?)
        run: |
          find rootfs/home/yugabyte \( -name '*.so*' -o -path '*/bin/*' -o -path '*/postgres/bin/*' \) -type f | while read -r f; do
            file -b "$f" | grep -q 'ELF 64-bit.*ARM aarch64' || continue
            n=$(aarch64-linux-gnu-objdump -d --no-show-raw-insn "$f" 2>/dev/null | awk '$2 ~ /^(ldadd|ldclr|ldeor|ldset|swp|cas|casp|ldapr|ldapur|sdot|udot)[a-z]*$/ {c++} END{print c+0}')
            echo "$n ${f#rootfs/home/yugabyte/}"
          done | sort -rn | awk '$1>0' | head -40 | tee libs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scan
          path: |
            scan.txt
            libs.txt

  runner-info:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          uname -m; nproc; free -g | head -2; df -h / /mnt 2>/dev/null
          lscpu | grep -E 'Model name|Flags|Features' | cut -c1-200
