name: image
# Overlay a build run's Pi-4 tree onto the upstream arm64 image, smoke-test the resulting filesystem under QEMU
# as a Cortex-A72, and (only if push=true) publish it to GHCR.
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: build workflow run whose `overlay` artifact (overlay-abs.tgz) to use
        required: true
      tag:
        default: 2024.2.7.3-pi4
      push:
        description: publish ghcr.io/<owner>/yugabyte-pi:<tag> (public)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: overlay
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Build context (absolute-path tree, world-readable)
        run: |
          mkdir -p image/ctx && tar -xzf overlay-abs.tgz -C image/ctx
          sudo chmod -R a+rX image/ctx
          du -sh image/ctx
      - name: Build the arm64 image
        run: docker buildx build --platform linux/arm64 -t yugabyte-pi:test --load image
      - name: Smoke test the image filesystem (QEMU cortex-a72, master + tserver + YSQL)
        timeout-minutes: 30
        run: |
          cid=$(docker create --platform linux/arm64 yugabyte-pi:test)
          mkdir rootfs && docker export "$cid" | tar -x -C rootfs
          ls -l rootfs/home/yugabyte/bin/yb-master rootfs/home/yugabyte/bin/yb-tserver
          ./scripts/ysql-smoke.sh rootfs /__w/yugabyte-pi/yugabyte-pi/yb/build/release-clang17-dynamic-ninja
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: image-smoke, path: "master.log\ntserver.log" }
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push (only when push=true)
        if: inputs.push
        run: |
          docker buildx build --platform linux/arm64 -t ghcr.io/${{ github.repository_owner }}/yugabyte-pi:${{ inputs.tag }} --push image
